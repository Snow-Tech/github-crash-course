name: Deploy Project
on: [push]
jobs:
  lint:
   runs-on: macos-latest

   steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Install NodeJs
      uses: actions/setup-node@v4
      with:
          node-version: 18

    - name: Install dependencies
      run: npm ci

    - name: Install dependencies
      run: npm run lint

  test:
    needs: lint
    runs-on: macos-latest

    steps:
     - name: Get code
       uses: actions/checkout@v4
 
     - name: Install NodeJs
       uses: actions/setup-node@v4
       with:
           node-version: 18
 
     - name: Install dependencies
       run: npm ci
 
     - name: Install dependencies
       run: npm run test

  deploy:
    needs: test
    runs-on: macos-latest

    steps:
        - name: Get code
          uses: actions/checkout@v4
  
        - name: Install NodeJs
          uses: actions/setup-node@v4
          with:
              node-version: 18
  
        - name: Install dependencies
          run: npm ci
  
        - name: Build project
          run: npm run build

        - name: Deploy
          run: echo "deploying..."

