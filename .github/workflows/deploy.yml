name: Deploy Project
on: [push]
jobs:
  lint:
   runs-on: macos-latest

   steps:
    - name: Get code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

  test:
    needs: lint
    runs-on: macos-latest

    steps:
     - name: Get code
       uses: actions/checkout@v4
 
     - name: Install dependencies
       run: npm ci
 
     - name: Run Test
       run: npm run test

  deploy:
    needs: test
    runs-on: macos-latest

    steps:
        - name: Get code
          uses: actions/checkout@v4
  
        - name: Install dependencies
          run: npm ci
  
        - name: Build project
          run: npm run build

        - name: Deploy
          run: echo "deploying..."

